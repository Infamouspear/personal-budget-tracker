name: Windows release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 / Node 24
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/audit-history.cjs
  signed-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 / Node 24
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify version matches tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
      - name: Build cryptographically authenticated NSIS release
        run: npm run release:build
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - run: node scripts/audit-package.cjs
      - run: node scripts/verify-release.cjs
      - name: Verify optional Windows Authenticode signature
        shell: pwsh
        run: |
          $publisher = node -p "require('./release-config.json').publisherName"
          if (-not $publisher) { Write-Output 'Ed25519 release authentication is required; Windows Authenticode is not configured.'; exit 0 }
          $installer = Get-ChildItem dist/*Setup*.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') { throw 'Installer signature is not valid' }
      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/*Setup*.exe dist/*.blockmap dist/latest.yml dist/release-manifest.json --draft --verify-tag --title "Budget Tracker $env:GITHUB_REF_NAME" --notes 'Cryptographically authenticated Windows installer. Financial data stays on your device.'
